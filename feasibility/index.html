<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>横陆 · 演化实验</title><link rel="stylesheet" href="style.css">
<header><a href="/" title="返回旧版">青野</a><span class="tag">横陆实验</span><a href="/sideview/" target="_blank" rel="noopener" title="打开独立的连续侧视行旅原型">行旅原型 ↗</a><button id="play">运行</button><button id="step">＋1 年</button><button data-years="50">＋50 年</button><button data-years="300">＋300 年</button><button data-years="1000">＋1000 年</button><button data-years="30000" title="后台逐年推演，可随时暂停">＋30000 年</button><b id="year">生成中</b><span class="grow"></span><input id="seed" value="横陆-001" aria-label="地图种子"><select id="width" aria-label="地图宽度"><option value="512">512 × 256</option><option value="768">768 × 256</option><option value="1024">1024 × 256</option></select><button id="generate">生成</button><button id="export">导出观测</button></header>
<main><canvas id="map" aria-label="横版生态地图，可拖动缩放并点击观察"></canvas><nav aria-label="观察对象"><span>观察</span><button data-layer="natural" class="active">自然地表</button><button data-layer="air">地表灵气</button><button data-layer="plant">植物积累</button><button data-layer="source">地质供给</button><button data-layer="temperature">温度</button><button data-layer="rain">降雨</button><button data-layer="snow">降雪</button><label for="regions"><img id="region-icon" src="assets/terrain.svg" alt="" width="16" height="16">片区维度</label><select id="regions" aria-label="片区维度"><option value="none">关闭片区</option><option value="temperature">温度片区</option><option value="forest">林区</option><option value="terrain">地形片区</option><option value="qi">灵气特点</option><option value="composite">综合片区</option></select><details><summary>生成依据</summary><button data-layer="plates">七个板块</button><button data-layer="mantle">地幔背景</button><button data-layer="geology">山势与地热</button><button data-layer="retention">留存与吸引</button></details><hr><label><input id="baseline" type="checkbox">对照起点</label><button id="sample">观察灵树样本</button><label><input id="directions" type="checkbox">地表净流方向</label><label><input id="routes" type="checkbox">通行路线</label><label><input id="grid" type="checkbox">格线</label><button id="fit">全图</button></nav><aside id="detail" hidden><div class="aside-head"><b>地点观察</b><button id="close">×</button></div><div id="cell"></div><div class="edit"><button data-edit="tree">种灵树</button><button data-edit="source">切换供给</button><button data-edit="remove">移除植被</button></div><small>干预仅在暂停时生效；死亡库存回到遗骸。</small></aside><div id="legend"></div><div id="loading">依次生成板块、地幔背景、地形、温度、水系、灵气源与植被…</div></main>
<footer><span id="status">等待生成</span><span id="balance"></span><span id="hint">拖动平移 · 滚轮缩放 · 点击查看增量 / 存量 / 流量</span></footer><section id="history"><div><b>演化记录</b><span id="comparison">起点 → 当前</span></div><canvas id="chart" aria-label="地表灵气与植物积累时间变化"></canvas><div id="metrics"></div></section><script type="module" src="app.js"></script></html>
